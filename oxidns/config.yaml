# ============================================================================
# OxiDNS：三条独立解析流水线
#   流水线 1 国内   cn_pipeline       入口 :5337   只问国内上游 → 真实 IP
#   流水线 2 国外   foreign_pipeline  无独立端口    → fake-ip（映射由 mihomo :6666 生成）
#   流水线 3 默认   default_pipeline  入口 :5335   国内名单→国内链；其余(含漏网之鱼)→国外链
#   辅助链   混合   mixed_pipeline    入口 :5336   国内优先，非国内再走国外真实 IP（mihomo 自己用）
# working-dir = /var/lib/oxidns（/etc/init.d/oxidns 传 -d），所有 ./ 路径都相对它
# ============================================================================
# 规则来源（2026-10-10 起）：**oxidns 不再读 geosite.dat**，改用纯文本域名名单
#   国内   Loyalsoldier v2ray-rules-dat release/china-list.txt（111k 条，无后缀前缀=后缀匹配）
#   国外   Loyalsoldier release/gfw.txt（4.4k）+ 手写 force_noncn + 自动学习
#   广告   anti-ad.net/domains.txt（108k 裸域名，后缀匹配）+ 仓库里的 ad-whitelist.txt（49 条白名单）
#          + Loyalsoldier win-spy（Windows 遥测）
#   geoip  也已删：国内 IP 段改用 meta-rules-dat 的 geoip-lite 单码文本表 cn.list（153K，9608 条 CIDR）
#   geosite 已全部删除：oxidns 用文本名单，mihomo 用 MRS 单码 rule-set，本机不再有 GeoSite.dat
# 名单全部落在 /var/lib/oxidns/rules/（overlay），24h 刷新一次
# ============================================================================
log:
  level: error

api:
  http:
    listen: "192.168.10.1:9199"
    auth:
      type: basic
      username: "__SECRET_OXIDNS_USER__"
      password: "__SECRET_OXIDNS_PASSWORD__"   # 真值在 .secrets/oxidns.env（不进仓库）
    webui:
      root: "/usr/share/oxidns/webui/"
      index: "index.html"

plugins:
  # ------------------------------------------------------------------
  # 订阅刷新：文本名单 + 国内 IP 段表 → /var/lib/oxidns/rules/
  # ------------------------------------------------------------------
  - tag: subscription_cron
    type: cron
    args:
      timezone: Asia/Shanghai
      jobs:
        # 注意：不能用 schedule:（cron 插件会把 timezone 拼成 '0 5 * * 0 Asia/Shanghai' 再去解析，必然失败并导致
        # 插件初始化失败 → oxidns 起不来）。统一用 interval。
        - name: refresh_rule_providers
          interval: 24h
          executors:
            - $subscription_refresh
        - name: bootstrap_cn_ip_list
          interval: 168h
          executors:
            - $cn_ip_bootstrap

  - tag: subscription_refresh
    type: sequence
    args:
      - exec: $download_rule_lists
      - exec: $reload_rule_providers

  - tag: cn_ip_bootstrap
    type: sequence
    args:
      - exec: $download_cn_ip_list
      - exec: $reload_rule_providers

  # 文本名单（每行一条域名规则；# 为注释；无前缀 = domain: 后缀匹配）
  - tag: download_rule_lists
    type: download
    args:
      timeout: 120s
      startup_if_missing: true
      downloads:
        - url: https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/china-list.txt
          dir: /var/lib/oxidns/rules
          filename: china_domain_list.txt
        - url: https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/gfw.txt
          dir: /var/lib/oxidns/rules
          filename: gfw_domain_list.txt
        - url: https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/apple-cn.txt
          dir: /var/lib/oxidns/rules
          filename: apple_cn_list.txt
        - url: https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/google-cn.txt
          dir: /var/lib/oxidns/rules
          filename: google_cn_list.txt
        - url: https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/win-spy.txt
          dir: /var/lib/oxidns/rules
          filename: win_spy_list.txt
        - url: https://anti-ad.net/domains.txt
          dir: /var/lib/oxidns/rules
          filename: anti-ad-domains.txt

  # 国内 IP 段表（geoip-lite 单码 cn.list，153K）；geosite/geoip.dat 均已删，mihomo 改用 MRS rule-set
  - tag: download_cn_ip_list
    type: download
    args:
      timeout: 120s
      startup_if_missing: true
      downloads:
        - url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.list
          dir: /var/lib/oxidns/rules
          filename: cn-ip.list

  # ------------------------------------------------------------------
  # provider（规则集）
  # ------------------------------------------------------------------

  # 唯一使用 IP 段的 provider：答案 IP 是否落在 CN（混合链防污染判定）
  - tag: cn_ips
    type: ip_set
    args:
      files:
        - /var/lib/oxidns/rules/cn-ip.list

  # ---- 国内名单 ----
  - tag: china_list
    type: domain_set
    args:
      files:
        - /var/lib/oxidns/rules/china_domain_list.txt

  - tag: apple_cn_list
    type: domain_set
    args:
      files:
        - /var/lib/oxidns/rules/apple_cn_list.txt

  - tag: google_cn_list
    type: domain_set
    args:
      files:
        - /var/lib/oxidns/rules/google_cn_list.txt

  # 国内域名总入口 = china-list + apple@cn + google@cn + .cn 顶级域 + 自动学习
  - tag: china_domains
    type: domain_set
    args:
      exps:
        - domain:cn
      sets:
        - china_list
        - apple_cn_list
        - google_cn_list
        - learned_china

  # ---- 国外名单 ----
  - tag: gfw_list
    type: domain_set
    args:
      files:
        - /var/lib/oxidns/rules/gfw_domain_list.txt

  - tag: force_noncn
    type: domain_set
    args:
      exps:
        - domain:pterclub.com
        - domain:dl.google.com
        - domain:u2.dmhy.org
        - domain:gstatic.com
        - domain:cachix.org
        - domain:nix-community.cachix.org
        - domain:cache.numtide.com

  # 国外域名总入口 = gfw.txt + 手写 force_noncn + 自动学习
  - tag: gfw_domains
    type: domain_set
    args:
      sets:
        - gfw_list
        - force_noncn
        - learned_foreign

  # ---- 广告 / 遥测 ----
  # 广告名单用 anti-AD 官方 domains.txt（裸域名 = 后缀匹配）；
  # 白名单（ad-whitelist.txt，从 anti-ad-adguard.txt 的 @@ 例外提取，49 条）在 block_seq 里先判，
  # 命中就 return 跳过广告拦截（domains.txt 本身不带白名单，必须靠这份补）
  - tag: ad_whitelist
    type: domain_set
    args:
      files:
        - /var/lib/oxidns/rules/ad-whitelist.txt

  - tag: ad_rules
    type: domain_set
    args:
      files:
        - /var/lib/oxidns/rules/anti-ad-domains.txt

  - tag: win_telemetry
    type: domain_set
    args:
      files:
        - /var/lib/oxidns/rules/win_spy_list.txt

  - tag: hosts
    type: hosts
    args:
      entries:
        - domain:a99r50.klchen.duckdns.org 192.168.10.248
        - domain:a2700.klchen.duckdns.org 192.168.0.197
        - domain:sanjiao.klchen.duckdns.org 192.168.0.198
        - domain:i12400.klchen.duckdns.org 192.168.0.199
        - domain:klchen.duckdns.org 192.168.0.210

  - tag: ecscn
    type: domain_set
    args:
      exps:
        - tv.micu.hk
        - tv1.micu.hk
        - v0.micu.hk
        - v1.micu.hk
        - v2.micu.hk

  - tag: local_ptr
    type: domain_set
    args:
      exps:
        - 168.192.in-addr.arpa.
        - 16.172.in-addr.arpa.
        - 10.in-addr.arpa.

  - tag: reload_rule_providers
    type: reload_provider
    args:
      - $cn_ips
      - $china_list
      - $apple_cn_list
      - $google_cn_list
      - $gfw_list
      - $ad_rules
      - $win_telemetry

  # ------------------------------------------------------------------
  # 自动学习（learn_domain → dynamic_domain_set）
  #   mixed_pipeline 是唯一入口：用真实 IP 解析成功后，按答案 IP 归属回写：
  #     - 命中 geoip_cn → 学为 learned_china（下次走 cn_pipeline 拿真实 IP）
  #     - 未命中        → 学为 learned_foreign（下次走 foreign_pipeline 拿 fake-ip）
  #   phase:after 自带两道闸：rcode==NOERROR 且 answer 非空才学，失败不学（error_mode:continue）。
  #   名单持久化在 <working-dir>/rules/ 下，重启保留；worker 批量落盘并即时换快照，
  #   无需 reload_rule_providers 干预。
  # ------------------------------------------------------------------
  - tag: learned_china
    type: dynamic_domain_set
    args:
      path: ./rules/learned_china_list.txt

  - tag: learned_foreign
    type: dynamic_domain_set
    args:
      path: ./rules/learned_foreign_list.txt

  - tag: learn_china
    type: learn_domain
    args:
      provider: learned_china
      phase: after
      qtypes:
        - A
        - AAAA
      rule_kind: domain
      async: true
      error_mode: continue

  - tag: learn_foreign
    type: learn_domain
    args:
      provider: learned_foreign
      phase: after
      qtypes:
        - A
        - AAAA
      rule_kind: domain
      async: true
      error_mode: continue

  # ------------------------------------------------------------------
  # 上游
  # ------------------------------------------------------------------
  - tag: cn_dns
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: "https://dns.alidns.com/dns-query"
          dial_addr: "223.5.5.5"
          enable_pipeline: true
          enable_http3: true
        - addr: "https://dns.alidns.com/dns-query"
          dial_addr: "223.6.6.6"
          enable_pipeline: true
          enable_http3: true
        - addr: "https://dns.pub/dns-query"
          dial_addr: "119.29.29.29"

  - tag: google
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "https://dns.google/dns-query"
          dial_addr: "8.8.8.8"
          enable_pipeline: true
          socks5: "127.0.0.1:7890"
        - addr: "https://dns.google/dns-query"
          dial_addr: "8.8.4.4"
          enable_pipeline: true
          socks5: "127.0.0.1:7890"

  - tag: cloudflare
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "https://cloudflare-dns.com/dns-query"
          dial_addr: "1.1.1.1"
          enable_pipeline: true
          socks5: "127.0.0.1:7890"
        - addr: "https://cloudflare-dns.com/dns-query"
          dial_addr: "1.0.0.1"
          enable_pipeline: true
          socks5: "127.0.0.1:7890"

  - tag: forward_remote
    type: fallback
    args:
      primary: cloudflare
      secondary: google
      threshold: 500
      always_standby: true

  - tag: fakeip
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: "udp://127.0.0.1:6666"

  # ------------------------------------------------------------------
  # 缓存 / 观测 / 防护
  # ------------------------------------------------------------------
  - tag: cache_cn
    type: cache
    args:
      size: 16384
      lazy_cache_ttl: 86400
      dump_file: ./rules/dns_cache.dump
      dump_interval: 3600

  - tag: query_recorder_main
    type: query_recorder
    args:
      path: ./rules/query-recorder-main.sqlite
      queue_size: 8192
      batch_size: 256
      flush_interval_ms: 200
      memory_tail: 1024
      retention_days: 3
      cleanup_interval_hours: 1

  - tag: rate_limit
    type: rate_limiter
    args:
      qps: 200
      burst: 400
      mask4: 32
      mask6: 48

  - tag: ad_blackhole
    type: black_hole
    args:
      ips:
        - 0.0.0.0
        - "::"
      short_circuit: true

  - tag: block_seq
    type: sequence
    args:
      - matches: qtype 65 255
        exec: reject 0
      # 白名单优先：命中就 return（block_seq 结束，调用方从 jump 后一条继续），不进广告黑洞
      - matches: qname $ad_whitelist
        exec: return
      - matches: qname $ad_rules
        exec: $ad_blackhole
      - matches: qname $win_telemetry
        exec: $ad_blackhole
      - matches: qname $local_ptr
        exec: reject 3

  - tag: ecs_cn
    type: ecs_handler
    args:
      forward: false
      preset: 123.116.100.114
      send: false
      mask4: 24
      mask6: 48

  - tag: no_ecs
    type: ecs_handler
    args:
      forward: false
      preset: ""
      send: false
      mask4: 24
      mask6: 48

  # ==================================================================
  # 流水线
  # ==================================================================
  # 流水线 1 · 国内：只问国内上游，返回真实 IP
  - tag: cn_pipeline
    type: sequence
    args:
      - exec: $cache_cn
      - matches: has_resp
        exec: accept
      - matches: qname $ecscn
        exec: $ecs_cn
      - exec: $cn_dns
      - matches: has_resp
        exec: accept

  # 流水线 2 · 国外：返回 fake-ip
  - tag: foreign_pipeline
    type: sequence
    args:
      - exec: drop_resp
      - exec: $fakeip
      - matches: has_resp
        exec: accept

  # 流水线 3 · 默认：国外名单→国外链；国内名单→国内链；其余（含漏网之鱼）→国外链 fake-ip
  - tag: default_pipeline
    type: sequence
    args:
      - exec: $query_recorder_main
      - matches: "!$rate_limit"
        exec: reject 3
      - exec: $hosts
      - matches: has_resp
        exec: accept
      - exec: jump block_seq
      - matches: qname $gfw_domains
        exec: $foreign_pipeline
      - matches: has_resp
        exec: accept
      - matches: qname $china_domains
        exec: $cn_pipeline
      - matches: has_resp
        exec: accept
      - exec: $foreign_pipeline
      - matches: has_resp
        exec: accept

  # 国外真实 IP 解析段（混合链复用：gfw 名单直接走这里，不碰国内上游）
  - tag: remote_leg
    type: sequence
    args:
      - exec: $no_ecs
      - exec: prefer_ipv4
      - exec: $forward_remote
      - matches: has_resp
        exec: $learn_foreign
      - matches: has_resp
        exec: accept

  # 辅助链 · 混合：国内优先，非国内走国外真实 IP（给 mihomo 自己解析用）
  # 注意：这里用 resp_ip $cn_ips 而不是 has_resp 收口 —— 国内 DNS 对国外域名会返回
  # 被污染的答案（实测 www.google.com → 69.171.235.22），只有答案真的落在 CN 才认，
  # 否则继续往下问国外 DoH（fallback 失败时仍返回国内答案兜底）。
  # 同时是“自动学习”的唯一入口：真实 IP 解析成功后按归属回写 learned_china /
  # learned_foreign（learn_domain phase:after 自带 NOERROR + 有答案两道闸）。
  - tag: mixed_pipeline
    type: sequence
    args:
      - exec: $hosts
      - matches: has_resp
        exec: accept
      # 已知国外域名：直接问国外 DoH，省掉一次国内上游（少一次污染风险 + 少一次往返）
      - matches: qname $gfw_domains
        exec: jump remote_leg
      - exec: $cn_dns
      - matches: resp_ip $cn_ips
        exec: $learn_china
      - matches: resp_ip $cn_ips
        exec: accept
      - exec: jump remote_leg

  # ==================================================================
  # 入口
  # ==================================================================
  - tag: udp_server_5335
    type: udp_server
    args:
      entry: default_pipeline
      listen: ":5335"
  - tag: tcp_server_5335
    type: tcp_server
    args:
      entry: default_pipeline
      listen: ":5335"
  - tag: udp_server_5336
    type: udp_server
    args:
      entry: mixed_pipeline
      listen: ":5336"
  - tag: tcp_server_5336
    type: tcp_server
    args:
      entry: mixed_pipeline
      listen: ":5336"
  - tag: udp_server_5337
    type: udp_server
    args:
      entry: cn_pipeline
      listen: ":5337"
  - tag: tcp_server_5337
    type: tcp_server
    args:
      entry: cn_pipeline
      listen: ":5337"
