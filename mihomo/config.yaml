  - {name: CAD故转, <<: *FB, use: [cad],  icon: *Failover}
  - {name: 香港故转, <<: *FB, filter: *HK, icon: *Failover}
  - {name: 日本故转, <<: *FB, filter: *JP, icon: *Failover}
  - {name: 台湾故转, <<: *FB, filter: *TW, icon: *Failover}
